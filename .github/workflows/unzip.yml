
name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o BHAGRO-split3.zip -d extracted

      - name: Copy and Update Files Safely
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.workspace' \
            --exclude='node_modules' \
            extracted/ ./

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update files from ZIP" || echo "No changes"

          git push
          
