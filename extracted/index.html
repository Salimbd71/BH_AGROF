<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bioherbs Agrovet - Animal Health ERP & SR Management</title>
  <meta name="description" content="Comprehensive Animal Health Products ERP, SR Order Booking, Inventory & Sales Analytics for Bioherbs Agrovet." />
  <meta property="og:title" content="Bioherbs Agrovet - Animal Health ERP" />
  <meta property="og:description" content="Veterinary Pharmaceuticals & Animal Nutrition order management system." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts: Inter & Hind Siliguri for beautiful Bengali & English typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            tealbrand: {
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            }
          },
          fontFamily: {
            sans: ['"Hind Siliguri"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (xlsx.full.min.js) for Excel export & bulk product upload -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- html2pdf.js for high-fidelity client-side PDF Invoice generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase JavaScript SDK v10 (Compat version for reliable standalone CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.6);
    }

    /* ===== Mobile / Desktop / PWA friendly base ===== */
    html {
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain; /* অ্যাপ মোডে আকস্মিক pull-to-refresh বন্ধ */
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom);
    }
    button, a, select, label, [onclick] { touch-action: manipulation; } /* ডাবল-ট্যাপ জুম/দেরি বন্ধ */
    :focus-visible { outline: 2px solid #10b981; outline-offset: 2px; } /* কীবোর্ড ব্যবহারকারীর জন্য (ডেস্কটপ) */
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; }

    /* ছোট স্ক্রিনে ইনপুট ১৬px: iPhone-এ ফোকাস করলে পেজ জুম হয় না */
    @media (max-width: 1023px) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),
      select, textarea { font-size: 16px !important; }
      #toastContainer {
        bottom: calc(5.5rem + env(safe-area-inset-bottom)) !important;
        left: 0.75rem !important; right: 0.75rem !important; max-width: none !important;
      }
    }

    /* মোডাল ছোট স্ক্রিনে কেটে না গিয়ে ভেতরে স্ক্রল করবে */
    #srModal > div, #adminCreateModal > div, #customerAddModal > div, #productAddModal > div,
    #lowStockModal > div, #appConfirmModal > div, #firebaseModal > div {
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
    }

    /* ছাপার সময় নেটওয়ার্ক ব্যানার লুকানো */
    @media print { #netBanner { display: none !important; } }
    .print-only {
      display: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printableInvoice, #printableInvoice * {
        visibility: visible;
      }
      #printableInvoice {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

  <!-- অফলাইন / সিঙ্ক / আপডেট / ইনস্টল ব্যানার (pwa.ts) -->
  <div id="netBanner"></div>

  <!-- Veterinary ERP Loading Splash Screen -->
  <div id="appSplashScreen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-between p-6 bg-gradient-to-b from-emerald-50 via-white to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 transition-all duration-700 ease-out select-none">
    <div class="h-8"></div>

    <!-- Center Content: Logo Emblem, Branding, and Loading Circle -->
    <div class="flex flex-col items-center text-center max-w-sm px-4">
      <!-- 3D Veterinary Product Icon with Pulse Ring -->
      <div class="relative mb-6">
        <div class="absolute -inset-2 rounded-3xl bg-emerald-500/20 blur-xl animate-pulse"></div>
        <div class="relative w-64 sm:w-80 rounded-3xl overflow-hidden shadow-2xl shadow-emerald-700/20 ring-4 ring-emerald-500/30 bg-white">
          <img 
            src="/bioherbs_logo.jpg" 
            alt="Bioherbs Agrovet" 
            class="block w-full h-auto" 
          />
        </div>
        <!-- Veterinary Cross Mini Badge -->
        <div class="absolute -bottom-2 -right-2 bg-emerald-600 text-white p-2 rounded-2xl shadow-lg ring-2 ring-white dark:ring-slate-900">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
          </svg>
        </div>
      </div>

      <!-- App Branding -->
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">
        Bioherbs Agrovet
      </h1>
      <p class="text-xs sm:text-sm font-semibold text-emerald-700 dark:text-emerald-400 mt-1">
        A DLS Approved Company
      </p>

      <!-- Veterinary Loading Circle & Status Indicator -->
      <div class="mt-8 flex flex-col items-center gap-3">
        <!-- Dual ring animated spinner -->
        <div class="relative w-12 h-12">
          <!-- Background track circle -->
          <div class="w-12 h-12 rounded-full border-4 border-emerald-100 dark:border-emerald-950/80"></div>
          <!-- Spinning animated circle -->
          <div class="absolute top-0 left-0 w-12 h-12 rounded-full border-4 border-transparent border-t-emerald-600 border-r-tealbrand-500 animate-spin"></div>
        </div>

        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500 dark:text-slate-400">
          <span id="splashStatusText">লোড হচ্ছে...</span>
        </div>
      </div>
    </div>

    <!-- Bottom Footer Tagline -->
    <div class="text-center text-[11px] text-slate-400 dark:text-slate-500 font-medium pb-2">
      <span>বায়োহার্বস এগ্রোভেট • ফিল্ড এসআর ও সেন্ট্রাল ইনভেন্টরি ম্যানেজমেন্ট</span>
    </div>
  </div>

  <!-- Main Application Wrapper -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Dynamic Content Rendered Here via /src/main.ts -->
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Hidden PDF Generation Sandbox -->
  <div id="pdfInvoiceSandbox" class="fixed -left-[9999px] top-0 bg-white text-slate-900 w-[794px] p-8 shadow-2xl font-sans"></div>

  <!-- Modular Application Entry Point -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
